<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="50%" stop-color="#151513"/>
      <stop offset="100%" stop-color="#1c1a15"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8b45f"/>
      <stop offset="100%" stop-color="#e7c67a"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#151513" fill-opacity="0.7" stroke="#24231f" stroke-width="2"/>

  <!-- Vertical Accent Pillar -->
  <rect x="80" y="80" width="8" height="470" rx="4" fill="url(#accent)"/>

  <!-- Category Eyebrow Pill -->
  <rect x="120" y="95" width="160" height="36" rx="18" fill="#d8b45f" fill-opacity="0.15"/>
  <text x="200" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#d8b45f" text-anchor="middle" letter-spacing="2">ESSAYS &amp; IDEAS</text>

  <!-- Main Headline Title (plain SVG text — renders in any SVG viewer/rasterizer, unlike foreignObject) -->
  <text x="120" y="235" font-family="'Bricolage Grotesque', system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" fill="#ece7db" letter-spacing="-1px">
    <tspan x="120" dy="0">Kunal Suri &#183; Software,</tspan>
    <tspan x="120" dy="62">Systems &amp; Engineering</tspan>
  </text>

  <!-- Tagline / Description -->
  <text x="120" y="405" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#918b7e">
    <tspan x="120" dy="0">I write about building software &#8212; the decisions</tspan>
    <tspan x="120" dy="36">behind the code, and the ideas worth keeping.</tspan>
  </text>

  <!-- Footer Divider Line -->
  <line x1="120" y1="495" x2="1080" y2="495" stroke="#24231f" stroke-width="1.5"/>
  <text x="120" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ece7db">kunalsuri.github.io</text>
  <text x="1080" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#d8b45f" text-anchor="end">Kunal Suri</text>
</svg>
