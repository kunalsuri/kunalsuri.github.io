version: 2
updates:
  # Automated weekly dependency updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Group dependencies to minimize PR clutter and run CI efficiently
    groups:
      astro-and-framework:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "preact"
          - "@tailwindcss/*"
          - "tailwindcss"
      build-and-tools:
        patterns:
          - "typescript"
          - "vitest"
          - "@astrojs/check"
          - "pagefind"
          - "unified"
          - "remark-*"
          - "rehype-*"
          - "js-yaml"
          - "zod"
    ignore:
      # @astrojs/check (0.9.10, the latest release) peers typescript
      # "^5.0.0 || ^6.0.0". A major bump to TypeScript 7 makes `npm ci` fail
      # outright and `astro check` crash, which takes CI down. Hold at 6.x
      # until a release of @astrojs/check widens that range, then remove this.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
