version: 2
updates:
  # Automated weekly dependency updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Group dependencies to minimize PR clutter and run CI efficiently
    groups:
      astro-and-framework:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "preact"
          - "@tailwindcss/*"
          - "tailwindcss"
      build-and-tools:
        patterns:
          - "typescript"
          - "vitest"
          - "@astrojs/check"
          - "pagefind"
          - "unified"
          - "remark-*"
          - "rehype-*"
          - "js-yaml"
          - "zod"
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
